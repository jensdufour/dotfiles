[colors]
background = #1b1b1a
foreground = #f3f1e9
primary = #d6d4cc
secondary = #b6b5ae
alert = #9c5f55
disabled = #676763

[bar/main]
width = 100%:-20
offset-x = 10
offset-y = 10
height = 26
radius = 8
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "Inconsolata Nerd Font Mono:size=10;2"
font-1 = "Inconsolata Nerd Font Mono:size=12;2"
modules-left = i3
modules-center = datetime
modules-right = pulseaudio wlan bluetooth filesystem cpu memory tray battery power
module-margin = 1
padding-left = 2
padding-right = 2
separator = "  "
enable-ipc = true
wm-restack = i3
override-redirect = true
cursor-click = pointer

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
label-focused = %name%:●
label-focused-foreground = ${colors.primary}
label-focused-padding = 1
label-unfocused = %name%:○
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1
label-urgent = %name%:!
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

[module/datetime]
type = internal/date
interval = 1
date = %A, %d %B
time = %H:%M
label = %date%  %time%
label-background = ${colors.primary}
label-foreground = ${colors.background}
label-padding = 1

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}
label-muted = 󰖁 muted
label-muted-foreground = ${colors.disabled}
click-right = pavucontrol

[module/wlan]
type = custom/script
interval = 5
exec = ${env:HOME}/.local/bin/network-status
click-left = ${env:HOME}/.local/bin/network-editor
click-right = ${env:HOME}/.local/bin/network-editor
format-connected = <label-connected>
label-connected = 󰤨 %essid%
label-connected-foreground = ${colors.primary}
format-disconnected = <label-disconnected>
label-disconnected = 󰤭 offline
label-disconnected-foreground = ${colors.disabled}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
label-mounted = 󰋊 %percentage_used%%
label-mounted-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
label = 󰍛 %percentage%%
label-foreground = ${colors.primary}

[module/memory]
type = internal/memory
interval = 2
label = 󰘚 %percentage_used%%
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray
format-margin = 4
[module/bluetooth]
type = custom/script
exec = ${env:HOME}/.local/bin/bluetooth-status
interval = 5
click-left = blueman-manager
label-foreground = ${colors.primary}

[module/battery]
type = internal/battery
battery = BAT1
adapter = ADP1
full-at = 98
poll-interval = 5
click-left = ${env:HOME}/.local/bin/power-menu
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
format-charging-foreground = ${colors.primary}
format-discharging-foreground = ${colors.primary}
format-full-foreground = ${colors.primary}
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
animation-charging-0 = 󰢜
animation-charging-1 = 󰂄
animation-charging-framerate = 750

[module/power]
type = custom/text
content = 󰐥
content-foreground = ${colors.alert}
content-padding = 1
click-left = ${env:HOME}/.local/bin/power-menu
